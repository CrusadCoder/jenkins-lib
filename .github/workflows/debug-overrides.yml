name: Debug Overrides Check

on:
  push:
    branches:
      - '**'
    paths:
      - 'vars/pipeline1C.groovy'
      - 'vars/applyDebugOverridesIfNeeded.groovy'
      - 'vars/restoreDebugOverridesIfNeeded.groovy'
      - 'src/ru/pulsar/jenkins/library/utils/DebugOverrides.groovy'
      - 'test/unit/groovy/ru/pulsar/jenkins/library/utils/DebugOverridesTest.java'
      - 'test/integration/groovy/pipeline1cTest.groovy'
      - 'build.gradle.kts'

permissions:
  contents: read

jobs:
  debug-overrides:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Run focused Debug Overrides tests
        run: ./gradlew test integrationTest --tests "*DebugOverridesTest" --tests "*pipeline1cTest"
